[Spoof]
; MallMode:
; 0 = 關閉商城功能
; 1 = 白名單模式 (讀取 mall_spoof.txt)
; 2 = 100% 全開模式
; 3 = 隨機百分比模式 (由 MallPercent 控制)
MallMode=1

; 商城開啟百分比 (僅在 MallMode=3 時生效，範圍 1~100)
MallPercent=30

; 地圖虛擬等級 (偽造 DzAPI_Map_GetMapLevel)
MapLevel=50

; 防作弊遊戲結束保護 (阻擋 EndGame, RestartGame, RemovePlayer, 戰役失敗彈窗)
; 1 = 開啟保護, 0 = 關閉保護
PreventGameOver=1
